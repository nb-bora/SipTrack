[project]
name = "siptrack-backend"
version = "0.1.0"
description = "SipTrack — API (Django, DDD + Clean Architecture)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "drf-spectacular[sidecar]>=0.27",
    "gunicorn>=26.0.0",
    "whitenoise>=6.12.0",
]

# PEP 735 — groupes de dépendances (gérés par uv)
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
    "import-linter>=2.1",
]

# Projet applicatif (pas une bibliothèque) : pas de build-system → uv ne le "package" pas.

# ---------------------------------------------------------------------------
# Ruff — lint + format (remplace black, isort, flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/settings/*.py" = ["F403", "F405"]
"**/tests/*.py" = ["S101"]

# ---------------------------------------------------------------------------
# pytest / pytest-django
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
pythonpath = ["."]
testpaths = ["contexts", "tests"]
addopts = "-ra"

# ---------------------------------------------------------------------------
# mypy (+ django-stubs)
# ---------------------------------------------------------------------------
# MyPy : désactivé temporairement
# Les modèles Django + mypy strict = problème connu sans solution pragmatique.
# djangorestframework-stubs et django-stubs ne couvrent pas tous les cas.
# À réactiver quand on aura des annotations correctes ou une meilleure solution.
# Pour l'instant : ruff lint + ruff format + pytest + lint-imports suffisent.
