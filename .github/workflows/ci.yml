name: CI

# Quality gate automatique : rejoué à chaque push sur main et à chaque PR.
# Le statut passe au vert dès que tout est corrigé — sans intervention manuelle.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: "Backend/uv.lock"

      - name: Install dependencies (lockfile figé)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Types (mypy strict)
        run: uv run mypy .

      - name: Contrats d'architecture (import-linter)
        run: uv run lint-imports

      - name: Tests (pytest)
        run: uv run pytest
