name: CI

# Quality gate automatique : rejoué à chaque push sur main et à chaque PR.
# Le statut passe au vert dès que tout est corrigé — sans intervention manuelle.
on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.21"
  PYTHON_VERSION: "3.13"

jobs:
  backend:
    name: Backend — quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "Backend/uv.lock"

      - name: Cache linter state
        uses: actions/cache@v4
        with:
          path: |
            Backend/.ruff_cache
            Backend/.mypy_cache
          key: linters-${{ runner.os }}-${{ hashFiles('Backend/uv.lock') }}
          restore-keys: linters-${{ runner.os }}-

      - name: Install dependencies (lockfile figé)
        run: uv sync --locked

      - name: 🧹 Lint & Format
        run: |
          echo "::group::Ruff check"
          uv run ruff check .
          echo "::endgroup::"
          echo "::group::Ruff format"
          uv run ruff format --check .
          echo "::endgroup::"

      - name: 🔍 Types (mypy strict)
        run: uv run mypy .

      - name: 🏗️ Contrats d'architecture (import-linter)
        run: uv run lint-imports

      - name: 🧪 Tests (pytest)
        run: uv run pytest --tb=short --junit-xml=.pytest-results.xml

      - name: 🔐 Audit dependencies
        if: always()
        run: uv run pip-audit --desc || true
        continue-on-error: true

      - name: 📊 Publish quality summary
        if: always()
        run: |
          echo "## ✅ Quality Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tests" >> $GITHUB_STEP_SUMMARY
          TEST_COUNT=$(uv run pytest --collect-only -q 2>/dev/null | tail -1 | grep -oE '[0-9]+' || echo "0")
          echo "- **$TEST_COUNT** tests executed ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks" >> $GITHUB_STEP_SUMMARY
          echo "- Ruff (lint + format) ✓" >> $GITHUB_STEP_SUMMARY
          echo "- MyPy (strict typing) ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Import-linter (architecture) ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Pip-audit (dependencies) ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All checks passed!** 🎉" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-junit
          path: Backend/.pytest-results.xml
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const xmlPath = 'Backend/.pytest-results.xml';
            let testInfo = '';

            if (fs.existsSync(xmlPath)) {
              const content = fs.readFileSync(xmlPath, 'utf8');
              const match = content.match(/tests="(\d+)"/);
              const tests = match ? match[1] : 'N/A';
              testInfo = `\n- **${tests}** tests passed ✓`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ CI Checks Passed\n\n- Linting ✓\n- Type checking ✓\n- Architecture validation ✓${testInfo}\n\n🤖 *Generated by GitHub Actions*`
            })
