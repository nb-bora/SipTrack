name: CI

# Quality gate automatique : rejoué à chaque push sur main et à chaque PR.
# Le statut passe au vert dès que tout est corrigé — sans intervention manuelle.
on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - "render.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - "render.yaml"
      - ".github/workflows/ci.yml"

# Aucun droit accordé par défaut : chaque job déclare le strict nécessaire.
# Le bloc doit rester présent — le supprimer ferait retomber sur les droits par
# défaut du dépôt, qui sont souvent bien plus larges.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.21"
  PYTHON_VERSION: "3.13"

jobs:
  backend:
    name: Backend — quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # commentaire de résultat sur la PR
    defaults:
      run:
        working-directory: Backend

    # Les tests tournent sur PostgreSQL, comme le dev et la prod.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: siptrack
          POSTGRES_USER: siptrack
          POSTGRES_PASSWORD: siptrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: siptrack
      DB_USER: siptrack
      DB_PASSWORD: siptrack

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "Backend/uv.lock"

      - name: Cache linter state
        uses: actions/cache@v4
        with:
          path: |
            Backend/.ruff_cache
            Backend/.mypy_cache
          key: linters-${{ runner.os }}-${{ hashFiles('Backend/uv.lock') }}
          restore-keys: linters-${{ runner.os }}-

      - name: Install dependencies (lockfile figé)
        # --no-build : on n'installe que des roues déjà construites, donc aucun
        # script d'installation d'une dépendance ne s'exécute sur le runner.
        run: uv sync --locked --no-build

      - name: 🧹 Lint & Format
        id: lint
        run: |
          echo "::group::Ruff check"
          uv run --frozen --no-build ruff check .
          echo "::endgroup::"
          echo "::group::Ruff format"
          uv run --frozen --no-build ruff format --check .
          echo "::endgroup::"

      - name: 🔍 Types (mypy strict)
        id: types
        run: uv run --frozen --no-build mypy .

      - name: 🏗️ Contrats d'architecture (import-linter)
        id: archi
        run: uv run --frozen --no-build lint-imports

      - name: 🧪 Tests (pytest)
        id: tests
        run: uv run --frozen --no-build pytest --tb=short --junit-xml=.pytest-results.xml

      # Toléré parce qu'un avis de vulnérabilité peut tomber sans qu'on y soit
      # pour rien — mais son résultat réel est publié, jamais présumé.
      - name: 🔐 Audit des dépendances (pip-audit)
        id: audit
        if: always()
        run: uv run --frozen --no-build pip-audit --desc
        continue-on-error: true

      - name: 📊 Publier le rapport de qualité
        if: always()
        env:
          # Chaque étape rend son résultat mesuré. Une coche écrite en dur a
          # affirmé pendant des semaines que pip-audit tournait, alors qu'il
          # n'était même pas installé.
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          ARCHI: ${{ steps.archi.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          marque() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              skipped) printf '⏭️ non exécuté' ;;
              *)       printf '❔ %s' "$1" ;;
            esac
          }

          {
            echo "## Rapport de qualité"
            echo ""
            echo "| Contrôle | Résultat |"
            echo "|---|---|"
            echo "| Ruff (lint + format) | $(marque "$LINT") |"
            echo "| MyPy (strict) | $(marque "$TYPES") |"
            echo "| Import-linter (architecture) | $(marque "$ARCHI") |"
            echo "| Pytest | $(marque "$TESTS") |"
            echo "| pip-audit (dépendances) | $(marque "$AUDIT") |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f .pytest-results.xml ]; then
            NOMBRE=$(grep -oP 'tests="\K[0-9]+' .pytest-results.xml | head -1)
            echo "**${NOMBRE:-0}** tests exécutés." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Aucun fichier de résultats : les tests n'ont pas produit de rapport." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-junit
          path: .pytest-results.xml
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const xmlPath = '.pytest-results.xml';
            let testInfo = '';

            if (fs.existsSync(xmlPath)) {
              const content = fs.readFileSync(xmlPath, 'utf8');
              const match = content.match(/tests="(\d+)"/);
              const tests = match ? match[1] : 'N/A';
              testInfo = `\n- **${tests}** tests passed ✓`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ CI Checks Passed\n\n- Linting ✓\n- Type checking ✓\n- Architecture validation ✓${testInfo}\n\n🤖 *Generated by GitHub Actions*`
            })

  # ---------------------------------------------------------------------------
  # Déploiement continu sur Render.
  #
  # `needs: backend` est le garde-fou : le déploiement n'existe que si la
  # quality gate est verte. Render est configuré en `autoDeploy: false`
  # (cf. render.yaml) précisément pour que ce job soit le seul déclencheur —
  # sinon Render déploierait de son côté sans attendre le moindre test.
  # ---------------------------------------------------------------------------
  deploy:
    name: Déploiement — Render
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Ce job ne fait qu'un POST vers une URL : il ne lit ni n'écrit rien du
    # dépôt, donc il n'a besoin d'aucun droit sur le jeton GitHub.
    permissions: {}
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}

    steps:
      - name: 🚀 Déclencher le déploiement
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning title=Déploiement non configuré::Le secret RENDER_DEPLOY_HOOK_URL est absent. Rien n'a été déployé."
            {
              echo "## ⚠️ Déploiement ignoré"
              echo ""
              echo "Le secret \`RENDER_DEPLOY_HOOK_URL\` n'est pas défini."
              echo ""
              echo "Pour l'activer : Render → service \`siptrack-api\` → Settings →"
              echo "Deploy Hook, puis coller l'URL dans GitHub → Settings → Secrets"
              echo "and variables → Actions."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Appel du deploy hook Render…"
          # --fail-with-body : un 4xx/5xx fait échouer l'étape tout en affichant
          # la réponse, sinon curl renvoie 0 et le déploiement raté passe pour
          # un succès.
          reponse=$(curl --silent --show-error --fail-with-body                          --retry 3 --retry-delay 5 --max-time 30                          -X POST "$HOOK_URL")
          echo "Réponse Render : $reponse"

      # -----------------------------------------------------------------
      # Constater, pas supposer.
      #
      # Le hook répond « sync started » et s'arrête là. Sur la PR #56, cette
      # réponse a suffi à déclarer le job vert alors que la production a servi
      # l'ancienne version pendant près d'une heure. Un pipeline qui affirme
      # sans vérifier ferme la question au lieu de la poser.
      #
      # On interroge donc l'instance jusqu'à y lire le commit attendu.
      # -----------------------------------------------------------------
      - name: 🔎 Constater que le commit est bien servi
        env:
          # Le contexte `secrets` n'est pas utilisable dans un `if` : la
          # condition vit donc dans le script, comme a l'etape precedente.
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          URL_SANTE: ${{ vars.RENDER_SERVICE_URL || 'https://siptrack-api.onrender.com' }}
          ATTENDU: ${{ github.sha }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "Aucun deploiement declenche : rien a constater."
            exit 0
          fi

          # Le plan gratuit met le service en veille et reconstruit lentement :
          # la fenêtre est large à dessein, l'échec doit signaler un vrai
          # problème, pas de l'impatience.
          TENTATIVES=40
          ATTENTE=15

          # La reponse est ecrite dans un fichier, puis lue depuis ce fichier.
          # Jamais un tube de curl vers l'interpreteur : on ne traite que des
          # donnees, et le corps reste consultable quand la boucle echoue.
          LECTURE='import json;print(json.load(open("sante.json")).get("commit",""))'

          for i in $(seq 1 "$TENTATIVES"); do
            curl --silent --max-time 10 -o sante.json "$URL_SANTE/api/sante/" || true
            servi=$(python3 -c "$LECTURE" 2>/dev/null || echo "")

            if [ "$servi" = "$ATTENDU" ]; then
              echo "Commit ${ATTENDU:0:7} servi en production."
              {
                echo "## 🚀 Déploiement constaté"
                echo ""
                echo "Le commit \`${ATTENDU:0:7}\` est **servi par l'instance**, vérifié sur \`/api/sante/\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "($i/$TENTATIVES) servi=${servi:-injoignable} attendu=${ATTENDU:0:7}"
            sleep "$ATTENTE"
          done

          echo "::error title=Déploiement non constaté::Le commit attendu n'est pas servi après $((TENTATIVES * ATTENTE))s."
          {
            echo "## ❌ Déploiement non constaté"
            echo ""
            echo "Le hook a été appelé, mais \`/api/sante/\` sert encore un autre commit"
            echo "après $((TENTATIVES * ATTENTE)) secondes."
            echo ""
            echo "Attendu : \`${ATTENDU:0:7}\` — servi : \`${servi:-injoignable}\`"
            echo ""
            echo "À regarder sur Render → \`siptrack-api\` → **Events**, puis **Logs** :"
            echo "le build a-t-il démarré, et a-t-il échoué ?"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
