name: CI

# Quality gate automatique : rejoué à chaque push sur main et à chaque PR.
# Le statut passe au vert dès que tout est corrigé — sans intervention manuelle.
on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.21"
  PYTHON_VERSION: "3.13"

jobs:
  backend:
    name: Backend — quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    # Les tests tournent sur PostgreSQL, comme le dev et la prod.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: siptrack
          POSTGRES_USER: siptrack
          POSTGRES_PASSWORD: siptrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: siptrack
      DB_USER: siptrack
      DB_PASSWORD: siptrack

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "Backend/uv.lock"

      - name: Cache linter state
        uses: actions/cache@v4
        with:
          path: |
            Backend/.ruff_cache
            Backend/.mypy_cache
          key: linters-${{ runner.os }}-${{ hashFiles('Backend/uv.lock') }}
          restore-keys: linters-${{ runner.os }}-

      - name: Install dependencies (lockfile figé)
        run: uv sync --locked

      - name: 🧹 Lint & Format
        run: |
          echo "::group::Ruff check"
          uv run --frozen --no-build ruff check .
          echo "::endgroup::"
          echo "::group::Ruff format"
          uv run --frozen --no-build ruff format --check .
          echo "::endgroup::"

      - name: 🔍 Types (mypy strict)
        run: uv run --frozen --no-build mypy .

      - name: 🏗️ Contrats d'architecture (import-linter)
        run: uv run --frozen --no-build lint-imports

      - name: 🧪 Tests (pytest)
        run: uv run --frozen --no-build pytest --tb=short --junit-xml=.pytest-results.xml

      - name: 🔐 Audit dependencies
        if: always()
        run: uv run --frozen --no-build pip-audit --desc
        continue-on-error: true

      - name: 📊 Publish quality summary
        if: always()
        run: |
          echo "## ✅ Quality Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tests" >> $GITHUB_STEP_SUMMARY
          if [ -f .pytest-results.xml ]; then
            TEST_COUNT=$(grep -oP 'tests="\K[0-9]+' .pytest-results.xml | head -1)
            echo "- **${TEST_COUNT:-0}** tests executed ✓" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **0** tests (no results file)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks" >> $GITHUB_STEP_SUMMARY
          echo "- Ruff (lint + format) ✓" >> $GITHUB_STEP_SUMMARY
          echo "- MyPy (strict typing) ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Import-linter (architecture) ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Pip-audit (dependencies) ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "**All checks passed!** 🎉" >> $GITHUB_STEP_SUMMARY
          else
            echo "**⚠️ Some checks failed** — review details above" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-junit
          path: .pytest-results.xml
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const xmlPath = '.pytest-results.xml';
            let testInfo = '';

            if (fs.existsSync(xmlPath)) {
              const content = fs.readFileSync(xmlPath, 'utf8');
              const match = content.match(/tests="(\d+)"/);
              const tests = match ? match[1] : 'N/A';
              testInfo = `\n- **${tests}** tests passed ✓`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ CI Checks Passed\n\n- Linting ✓\n- Type checking ✓\n- Architecture validation ✓${testInfo}\n\n🤖 *Generated by GitHub Actions*`
            })
