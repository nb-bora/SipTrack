# Infrastructure Render décrite dans le dépôt (Blueprint).
#
# À brancher une seule fois : Render → New → Blueprint → pointer ce dépôt.
# Ensuite, tout changement d'infrastructure passe par une PR, comme le code.
#
# `autoDeploy: false` est délibéré : Render ne déploie pas de lui-même à chaque
# push. C'est la CI qui déclenche, et seulement après la quality gate verte
# (cf. .github/workflows/ci.yml, job « deploy »). Sans cela, un push cassé
# partirait en production avant que le moindre test ait tourné.

services:
  - type: web
    name: siptrack-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: Backend
    autoDeploy: false
    buildCommand: "./render-build.sh"
    startCommand: "uv run --frozen --no-dev gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      # Généré par Render à la création, jamais visible dans le dépôt.
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: siptrack-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13"
      # Domaines supplémentaires (séparés par des virgules). L'hôte .onrender.com
      # est ajouté automatiquement par prod.py via RENDER_EXTERNAL_HOSTNAME.
      - key: ALLOWED_HOSTS
        value: ""

databases:
  - name: siptrack-db
    plan: free
    region: frankfurt
    databaseName: siptrack
    user: siptrack
